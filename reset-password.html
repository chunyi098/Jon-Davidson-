<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password | JonDavidson</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#f4f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;padding:2.5rem;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
    .logo{display:flex;align-items:center;gap:0.75rem;margin-bottom:2rem;text-decoration:none}
    .logo img{height:48px;width:auto}
    h2{font-size:1.5rem;font-weight:700;color:#1a1a1a;margin-bottom:0.35rem}
    p.sub{font-size:0.875rem;color:#666;margin-bottom:1.5rem}
    label{display:block;font-size:0.83rem;font-weight:600;margin-bottom:0.4rem;color:#1a1a1a}
    input{width:100%;padding:0.75rem 1rem;border:1.5px solid #e0e0e0;border-radius:6px;font-family:inherit;font-size:0.9rem;color:#1a1a1a;outline:none;transition:border-color 0.2s;margin-bottom:1rem}
    input:focus{border-color:#9e0403;box-shadow:0 0 0 3px rgba(158,4,3,0.08)}
    button{width:100%;padding:0.9rem;background:#9e0403;color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background 0.2s}
    button:hover{background:#7a0302}
    button:disabled{opacity:0.6;cursor:not-allowed}
    .msg{display:none;padding:0.75rem 1rem;border-radius:6px;font-size:0.85rem;font-weight:500;margin-bottom:1rem;text-align:center}
    .msg.err{background:#fef2f2;color:#cc0000;border:1px solid #fca5a5;display:block}
    .msg.ok{background:#f0fdf4;color:#15803d;border:1px solid #86efac;display:block}
    .back{text-align:center;margin-top:1rem;font-size:0.85rem;color:#666}
    .back a{color:#9e0403;font-weight:600;text-decoration:none}
  </style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo">
    <img src="assets/JonDavidsonLogo.webp%20.png" alt="JonDavidson"/>
  </a>
  <h2>Set new password</h2>
  <p class="sub">Choose a strong password for your account.</p>
  <div id="msg" class="msg"></div>
  <label>New Password</label>
  <input type="password" id="pw1" placeholder="Min. 8 characters"/>
  <label>Confirm Password</label>
  <input type="password" id="pw2" placeholder="Repeat your password" onkeydown="if(event.key==='Enter')doReset()"/>
  <button id="btn" onclick="doReset()">Update Password</button>
  <p class="back"><a href="login.html">← Back to login</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var _sb = supabase.createClient(
    'https://dmnybalszwcnkdnilsiv.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtbnliYWxzendjbmtkbmlsc2l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTY1ODcsImV4cCI6MjA5NDY5MjU4N30._x-Bt3YLoBEff-45JvkmFn5IpQZA3SWWdkZSxxQQehI'
  );
  function showMsg(text, ok) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }
  function doReset() {
    var pw1 = document.getElementById('pw1').value;
    var pw2 = document.getElementById('pw2').value;
    if(!pw1 || pw1.length < 8) { showMsg('Password must be at least 8 characters.', false); return; }
    if(pw1 !== pw2) { showMsg('Passwords do not match.', false); return; }
    var btn = document.getElementById('btn');
    btn.textContent = 'Updating...'; btn.disabled = true;
    _sb.auth.updateUser({ password: pw1 }).then(function(res) {
      if(res.error) {
        showMsg('Error: ' + res.error.message, false);
        btn.textContent = 'Update Password'; btn.disabled = false;
      } else {
        showMsg('\u2713 Password updated! Redirecting to login...', true);
        setTimeout(function(){ window.location.href = 'login.html'; }, 2000);
      }
    });
  }
</script>
</body>
</html>
